; LoRa ping/pong example.
;
; Flash one node with a *_ping environment and the other with a *_pong
; environment. The two nodes may use different boards.

[env]
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@^7.0.0   ; setPacketReceivedAction() requires RadioLib 6.0 or later

[t3]
; LilyGO T3 LoRa32 V1.6.1: ESP32-PICO-D4 with SX1276.
platform = espressif32
board = esp32dev
board_build.partitions = huge_app.csv
upload_speed = 921600

[xiao]
; Seeed Wio-SX1262 with XIAO ESP32-S3.
platform = espressif32
board = seeed_xiao_esp32s3

[env:t3_ping]
extends = t3
build_flags = -DBOARD_T3_V16 -DROLE_PINGER -DNODE_ID=1 -DPEER_ID=2

[env:t3_pong]
extends = t3
build_flags = -DBOARD_T3_V16 -DNODE_ID=2 -DPEER_ID=1

[env:xiao_ping]
extends = xiao
build_flags = -DBOARD_XIAO_SX1262 -DROLE_PINGER -DNODE_ID=1 -DPEER_ID=2 -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_pong]
extends = xiao
build_flags = -DBOARD_XIAO_SX1262 -DNODE_ID=2 -DPEER_ID=1 -DARDUINO_USB_CDC_ON_BOOT=1
