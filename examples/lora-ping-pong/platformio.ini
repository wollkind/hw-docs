; LoRa ping/pong across two boards in this library.
; Flash one node as *_ping and the other as *_pong. They can be different
; boards — that is the point of the demo.

[env]
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@^7.0.0     ; setPacketReceivedAction needs RadioLib >= 6.0

[t3]
; LilyGO T3 LoRa32 V1.6.1 — ESP32-PICO-D4 + SX1276
platform = espressif32
board = esp32dev
board_build.partitions = huge_app.csv
upload_speed = 921600

[xiao]
; Seeed Wio-SX1262 + XIAO ESP32-S3 kit.
; Stock platformio/espressif32 is fine for the S3; pioarduino is only needed
; for C6/C5 parts.
platform = espressif32
board = seeed_xiao_esp32s3
build_flags_common = -DARDUINO_USB_CDC_ON_BOOT=1

[env:t3_ping]
extends = t3
build_flags = -DBOARD_T3_V16 -DROLE_PINGER -DNODE_ID=1 -DPEER_ID=2

[env:t3_pong]
extends = t3
build_flags = -DBOARD_T3_V16 -DNODE_ID=2 -DPEER_ID=1

[env:xiao_ping]
extends = xiao
build_flags = -DBOARD_XIAO_SX1262 -DROLE_PINGER -DNODE_ID=1 -DPEER_ID=2 -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_pong]
extends = xiao
build_flags = -DBOARD_XIAO_SX1262 -DNODE_ID=2 -DPEER_ID=1 -DARDUINO_USB_CDC_ON_BOOT=1
